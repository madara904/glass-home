# Builds the desktop tool as programs that run without installing: one Glass Home.exe for
# Windows, Glass Home.app (Apple Silicon and Intel in one) for macOS, Glass-Home-Android.apk for
# phones (needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets). The TV app is built into
# the program; adb is spoken by the program itself. Every run publishes both files as a GitHub release: started
# by hand, it tags the commit v<version> from tool/src-tauri/tauri.conf.json itself (a new
# version there means a new release; the same version again replaces that release's files);
# a pushed tag like v0.2.0 releases under that tag.
name: Build tool

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: tool

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tool/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: tool/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle
      - name: Name the program
        shell: pwsh
        run: Copy-Item src-tauri/target/release/glass-home-tool.exe "Glass Home.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Glass-Home-Windows
          path: tool/Glass Home.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tool/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: tool/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Zip the app
        run: ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Glass Home.app" Glass-Home-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Glass-Home-macOS
          path: tool/Glass-Home-macOS.zip
          if-no-files-found: error

  # The phone app, signed with the release key from the ANDROID_KEYSTORE secrets.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tool/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: tool/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "The ANDROID_KEYSTORE secret is missing."; exit 1; }
          echo "$KEYSTORE" | base64 -d > src-tauri/gen/android/release.keystore
          printf 'storeFile=release.keystore\npassword=%s\nkeyAlias=glasshome\n' "$PASSWORD" > src-tauri/gen/android/keystore.properties
      - name: Build the phone app (64- and 32-bit ARM)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" JAVA_HOME="$JAVA_HOME_17_X64"
          pnpm tauri android build --apk --target aarch64 --target armv7
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Glass-Home-Android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Glass-Home-Android
          path: tool/Glass-Home-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag
        id: tag
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(jq -r .version tool/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Glass Home ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            out/Glass Home.exe
            out/Glass-Home-macOS.zip
            out/Glass-Home-Android.apk
