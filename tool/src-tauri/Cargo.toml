[package]
name = "glass-home-tool"
version = "0.2.2"
description = "Glass Home: debloat a Fire TV and give it the glass home screen, from the PC"
license = "MIT"
repository = "https://github.com/madara904/glass-home"
edition = "2021"

[lib]
name = "glass_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# adb over the network without the adb program; the TCP device and nothing else.
adb_client = { version = "3.2.3", default-features = false }
# App names from an APK's manifest and resources (instead of aapt2). 1.0.13 builds on Rust 1.94.
apk-info = "=1.0.13"
# The key a TV remembers this computer by, created once.
rsa = "0.9"
dns-lookup = "4.0.2"
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["devtools"] }
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# Rounded corners for the frameless window without the heavy shadow (DwmSetWindowAttribute).
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# On a phone, the GitHub links open through the system.
tauri-plugin-opener = "2"

[patch.crates-io]
# adb_client with three fixes for dropped connections; see vendor/adb_client/GLASS-HOME-PATCHES.md.
adb_client = { path = "vendor/adb_client" }
