[package]
name = "glass-home-tool"
version = "0.1.0"
description = "Glass Home: debloat a Fire TV and give it the glass home screen, from the PC"
license = "MIT"
repository = "https://github.com/madara904/glass-home"
edition = "2021"

[lib]
name = "glass_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dns-lookup = "4.0.2"
mdns-sd = "0.21.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["devtools"] }
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
